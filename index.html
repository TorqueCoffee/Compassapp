<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#E58825">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Torque Taste">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Torque Coffee — Find Your Flavor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --text: #FFFEF0;
      --text-muted: rgba(240, 236, 228, 0.4);
      --axis-line: rgba(240, 236, 228, 0.1);
      --card-bg: rgba(240, 236, 228, 0.05);
      --card-border: rgba(240, 236, 228, 0.08);
      --accent: #c8a96e;
      --puck: #E58825;

      --q-tl-muted: rgba(224, 136, 32, 0.25);
      --q-tr-muted: rgba(216, 72, 16, 0.25);
      --q-bl-muted: rgba(104, 64, 32, 0.25);
      --q-br-muted: rgba(136, 80, 248, 0.25);

      --q-tl-active: rgba(224, 136, 32, 0.55);
      --q-tr-active: rgba(216, 72, 16, 0.55);
      --q-bl-active: rgba(104, 64, 32, 0.55);
      --q-br-active: rgba(136, 80, 248, 0.55);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 200;
      gap: 16px;
    }
    #loading.hidden { display: none; }
    .splash-subtitle {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 12px;
      animation: subtitleReveal 300ms ease-out 400ms both;
    }
    @keyframes subtitleReveal {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .loading-dots {
      display: flex;
      gap: 6px;
    }
    .loading-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .loading-error {
      font-size: 16px;
      color: #c87a6e;
      text-align: center;
      padding: 0 32px;
      line-height: 1.6;
    }

    /* App shell */
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      flex: 0 0 8px;
    }

    /* Compass section */
    #compass-section {
      flex: 0 0 auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
      max-height: 52vh;
    }

    #compass {
      position: relative;
      width: min(calc(100vw - 32px), 52vh, 480px);
      aspect-ratio: 1;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: visible;
    }

    /* Crosshair axis lines — machine dividers, embedded between quadrant panels */
    #compass::before, #compass::after {
      content: '';
      position: absolute;
      background: var(--axis-line);
      pointer-events: none;
      z-index: 2;
    }
    #compass::before { /* horizontal */
      width: 100%; height: 2px;
      top: 50%; left: 0;
      transform: translateY(-50%);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 -1px 0 rgba(255, 255, 255, 0.05);
    }
    #compass::after { /* vertical */
      width: 2px; height: 100%;
      left: 50%; top: 0;
      transform: translateX(-50%);
      box-shadow: 1px 0 2px rgba(0, 0, 0, 0.3), -1px 0 0 rgba(255, 255, 255, 0.05);
    }

    /* Quadrant color panels — clipped to compass circle, behind all other layers */
    .compass-quadrants {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .quadrant {
      position: absolute;
      width: 50%;
      height: 50%;
      transition: background-color 300ms ease-out;
    }
    .quadrant.active { transition: background-color 250ms ease-out; }
    .quadrant.q-tl { top: 0; left: 0; background-color: var(--q-tl-muted); }
    .quadrant.q-tr { top: 0; right: 0; background-color: var(--q-tr-muted); }
    .quadrant.q-bl { bottom: 0; left: 0; background-color: var(--q-bl-muted); }
    .quadrant.q-br { bottom: 0; right: 0; background-color: var(--q-br-muted); }
    .quadrant.q-tl.active { background-color: var(--q-tl-active); }
    .quadrant.q-tr.active { background-color: var(--q-tr-active); }
    .quadrant.q-bl.active { background-color: var(--q-bl-active); }
    .quadrant.q-br.active { background-color: var(--q-br-active); }

    /* Circle ring around compass */
    .compass-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(240, 236, 228, 0.18);
      pointer-events: none;
      z-index: 1;
    }

    /* Surface noise overlay — soft-light works on dark backgrounds, overlay does not */
    .compass-noise {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 150px 150px;
      z-index: 1;
      mix-blend-mode: soft-light;
    }

    /* Axis arrow tips */
    .axis-arrow {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 2;
    }
    .arrow-top {
      top: 2px; left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 7px solid rgba(240,236,228,0.2);
    }
    .arrow-bottom {
      bottom: 2px; left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 7px solid rgba(240,236,228,0.2);
    }
    .arrow-left {
      left: 2px; top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 7px solid rgba(240,236,228,0.2);
    }
    .arrow-right {
      right: 2px; top: 50%;
      transform: translateY(-50%);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid rgba(240,236,228,0.2);
    }

    /* Axis labels — primary navigation cues, clearly legible */
    .axis-label {
      position: absolute;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(240, 236, 228, 0.75);
      pointer-events: none;
      white-space: nowrap;
      z-index: 2;
    }
    .axis-top    { top: 10px; left: 50%; transform: translateX(-50%); }
    .axis-bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }
    /* translateX(-50%/+50%) anchors the rotation center at the edge, matching top/bottom placement */
    .axis-left   { left: 10px; top: 50%; transform: translateX(-50%) translateY(-50%) rotate(-90deg); }
    .axis-right  { right: 10px; top: 50%; transform: translateX(50%) translateY(-50%) rotate(90deg); }

    /* Feeling pair tap targets — centered in each quadrant */
    .fp {
      position: absolute;
      width: 46%;
      height: 46%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
    }
    .fp.tr { top: 0; right: 0; }
    .fp.tl { top: 0; left: 0; }
    .fp.bl { bottom: 0; left: 0; }
    .fp.br { bottom: 0; right: 0; }

    /* Badge treatment — engraved label plate */
    .fp-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
      line-height: 1.4;
      pointer-events: none;
      padding: 5px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.04);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 1px 3px rgba(0, 0, 0, 0.15);
      transition: color 200ms ease, background 200ms ease, border-color 200ms ease;
    }
    .fp.active .fp-label {
      color: rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Puck — physical depth + grab/release physics */
    #puck {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #E58825;
      transform: translate(-50%, -50%);
      /* Warm edge ring visible on dark bg + strong lift shadows */
      box-shadow:
        0 0 0 2px rgba(255, 200, 100, 0.2),
        0 4px 12px rgba(0, 0, 0, 0.5),
        0 8px 25px rgba(0, 0, 0, 0.3);
      border: 1.5px solid rgba(255, 200, 100, 0.15);
      z-index: 10;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Release settle: spring on scale/shadow only, not position */
      transition: transform 150ms cubic-bezier(0.34, 1.3, 0.64, 1),
                  box-shadow 150ms ease-out;
    }
    #puck img {
      width: 55px;
      height: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Dragging state: lift off surface fast, track finger 1:1 */
    #puck.dragging {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow:
        0 0 0 2px rgba(255, 200, 100, 0.35),
        0 6px 18px rgba(0, 0, 0, 0.6),
        0 12px 35px rgba(0, 0, 0, 0.35);
      /* Fast entry transition for scale/shadow only */
      transition: transform 60ms ease-out, box-shadow 60ms ease-out;
    }
    /* Snap-to-quadrant: position animates, scale/shadow use base transition */
    #puck.snapping {
      transition:
        left 300ms cubic-bezier(0.22, 1, 0.36, 1),
        top 300ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 150ms cubic-bezier(0.34, 1.3, 0.64, 1),
        box-shadow 150ms ease-out;
    }

    /* Share vibe button — positioned on compass-section (outside drag element) */
    #share-btn {
      position: absolute;
      bottom: 0;
      right: 16px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      color: #E58825;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #share-btn:hover { opacity: 1 !important; }
    .puck-moved #share-btn {
      opacity: 0.7;
      pointer-events: auto;
    }
    /* Pulse animation on share confirm — ease-out correct here (confirmation gesture, not movement) */
    @keyframes sharePulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    #share-btn.pulsing {
      animation: sharePulse 300ms ease-out both;
    }

    /* Results section */
    #results {
      flex: 1 1 auto;
      min-height: 0;
      padding: 10px 16px 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Hint shown before first interaction */
    #hint {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hint-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-style: italic;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    /* Postcards grid — Change 8: spring entry */
    #postcards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-content: start;
    }
    #postcards.hidden { display: none; }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .postcard {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      animation: cardReveal 350ms cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }
    .postcard:nth-child(2) { animation-delay: 40ms; }

    .postcard-img-wrap {
      position: relative;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
      line-height: 0;
    }
    .postcard-img {
      display: block;
      width: 100%;
      height: 120px;
      object-fit: cover;
      object-position: top;
      border-radius: 0;
      background: rgba(255,255,255,0.04);
    }
    .postcard-img-placeholder {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.06) 100%);
    }
    /* Match % overlays the card image — warm LED readout */
    .postcard-match {
      position: absolute;
      bottom: 7px;
      left: 7px;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: #E58825;
      text-shadow:
        0 0 8px rgba(229, 136, 37, 0.4),
        0 0 20px rgba(229, 136, 37, 0.15);
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 7px;
      border-radius: 3px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      line-height: 1;
    }
    .postcard-body {
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .postcard-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(13px, 3vw, 16px);
      font-weight: 600;
      line-height: 1.2;
      color: var(--text);
    }
    .postcard-notes {
      font-size: 10px;
      font-weight: 400;
      color: rgba(240, 236, 228, 0.7);
      line-height: 1.4;
    }

    /* Button depth — gradient surface + warm shadow */
    .postcard-btn {
      display: block;
      margin-top: 6px;
      padding: 6px 8px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(30, 15, 0, 0.2);
      color: var(--text);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-align: center;
      transition: background 120ms ease, transform 80ms ease, box-shadow 80ms ease;
      flex-shrink: 0;
    }
    .postcard-btn:active {
      transform: translateY(1.5px);
      background: linear-gradient(to bottom, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.10) 100%);
      box-shadow: 0 0px 1px rgba(30, 15, 0, 0.15);
    }

    /* Controls bar */
    #controls {
      flex: 0 0 auto;
      padding: 8px 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .toggle-wrap span {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(240, 236, 228, 0.65);
    }
    .toggle {
      position: relative;
      width: 32px;
      height: 18px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.1);
      border-radius: 9px;
      cursor: pointer;
      transition: background 200ms ease;
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
      transition: left 200ms ease;
    }
    .toggle:checked { background: var(--accent); }
    .toggle:checked::after { left: 16px; }

    /* Prep filter segmented control — Change 4: button depth */
    #prep-filter {
      display: flex;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    .prep-btn {
      background: transparent;
      border: none;
      border-right: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, transform 80ms ease, box-shadow 80ms ease;
    }
    .prep-btn:last-child { border-right: none; }
    .prep-btn.active {
      background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .prep-btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #lightbox.hidden { display: none; }
    #lightbox-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
    }
    /* Change 8: Spring open for lightbox content */
    @keyframes lbOpen {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    #lightbox-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 90vw;
    }
    #lightbox:not(.hidden) #lightbox-content {
      animation: lbOpen 350ms cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }

    #lightbox-img {
      max-width: 90vw;
      max-height: 55vh;
      width: auto;
      height: auto;
      aspect-ratio: 5/7;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    /* Roast gauge */
    #lb-roast-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      animation: lbOpen 280ms cubic-bezier(0.34, 1.3, 0.64, 1) 40ms both;
    }
    .lb-roast-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
    }
    .lb-roast-bar {
      position: relative;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #F5E6C8, #C8860A, #2C1A0E);
      overflow: visible;
    }
    .lb-roast-indicator {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(30, 15, 0, 0.25);
      box-shadow: 0 1px 3px rgba(30, 15, 0, 0.2);
      transform: translate(-50%, -50%);
    }
    .lb-roast-value {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
    }

    /* USP line */
    #lb-usp {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      line-height: 1.4;
      max-width: 280px;
      animation: lbOpen 280ms cubic-bezier(0.34, 1.3, 0.64, 1) 80ms both;
    }

    /* Subscription line */
    #lb-sub {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      animation: lbOpen 280ms cubic-bezier(0.34, 1.3, 0.64, 1) 120ms both;
    }

    /* Lightbox match % — warm readout glow, no backing needed on solid dark bg */
    #lightbox-match {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #E58825;
      text-shadow:
        0 0 8px rgba(229, 136, 37, 0.4),
        0 0 20px rgba(229, 136, 37, 0.15);
    }

    /* Lightbox button — button depth */
    .lightbox-btn {
      display: block;
      padding: 10px 24px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(30, 15, 0, 0.2);
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-align: center;
      transition: background 120ms ease, transform 80ms ease, box-shadow 80ms ease;
    }
    .lightbox-btn:active {
      transform: translateY(1.5px);
      background: linear-gradient(to bottom, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.10) 100%);
      box-shadow: 0 0px 1px rgba(30, 15, 0, 0.15);
    }

    /* Share link toast */
    #share-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 20, 5, 0.9);
      color: rgba(255, 254, 240, 0.85);
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 200, 100, 0.12);
      opacity: 0;
      pointer-events: none;
      z-index: 300;
      white-space: nowrap;
      transition: opacity 200ms ease-out;
    }
    #share-toast.show { opacity: 1; }
    #share-toast.hide { opacity: 0; transition: opacity 500ms ease-out; }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <img src="/Torque-logo.png" alt="Torque Coffee" style="height:40px;margin-bottom:4px;opacity:0.85;" onerror="this.style.display='none'">
  <span class="splash-subtitle">Coffee Vibe Machine</span>
  <div class="loading-dots"><span></span><span></span><span></span></div>
</div>

<!-- App -->
<div id="app">
  <header></header>

  <div id="compass-section">
    <div id="compass">
      <div class="compass-quadrants">
        <div class="quadrant q-tl"></div>
        <div class="quadrant q-tr"></div>
        <div class="quadrant q-bl"></div>
        <div class="quadrant q-br"></div>
      </div>
      <span class="axis-label axis-top">Lively</span>
      <span class="axis-label axis-bottom">Syrupy</span>
      <span class="axis-label axis-left">Classic</span>
      <span class="axis-label axis-right">Modern</span>

      <div class="fp tl" onclick="snapToQuadrant(-50,50)">
        <span class="fp-label">Crisp &amp;<br>Clean</span>
      </div>
      <div class="fp tr" onclick="snapToQuadrant(50,50)">
        <span class="fp-label">Bright &amp;<br>Fruity</span>
      </div>
      <div class="fp bl" onclick="snapToQuadrant(-50,-50)">
        <span class="fp-label">Friendly &amp;<br>Round</span>
      </div>
      <div class="fp br" onclick="snapToQuadrant(50,-50)">
        <span class="fp-label">Deep &amp;<br>Complex</span>
      </div>

      <div class="compass-ring"></div>
      <div class="compass-noise" aria-hidden="true"></div>
      <span class="axis-arrow arrow-top"></span>
      <span class="axis-arrow arrow-bottom"></span>
      <span class="axis-arrow arrow-left"></span>
      <span class="axis-arrow arrow-right"></span>
      <div id="puck"><img src="/Torque-logo-cream.png" alt=""></div>
    </div>

    <!-- Share button is a sibling of #compass, not inside it — keeps it out of the drag event target -->
    <button id="share-btn" aria-label="Share your vibe">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13" />
        <path d="M22 2L15 22L11 13L2 9L22 2Z" />
      </svg>
    </button>
  </div>

  <div id="results">
    <div id="hint">
      <p class="hint-text">Drag the puck toward your vibe<br>or tap a feeling to jump there</p>
    </div>
    <div id="postcards" class="hidden"></div>
  </div>

  <div id="controls">
    <div id="prep-filter">
      <button class="prep-btn active" data-prep="all" onclick="setPrepFilter('all')">All</button>
      <button class="prep-btn" data-prep="espresso" onclick="setPrepFilter('espresso')">Espresso</button>
      <button class="prep-btn" data-prep="filter" onclick="setPrepFilter('filter')">Filter</button>
    </div>
    <label class="toggle-wrap">
      <input type="checkbox" id="decaf-toggle" class="toggle" onchange="onDecafChange()">
      <span>Decaf only</span>
    </label>
  </div>
</div>

<!-- Lightbox — Change 6: new content order -->
<div id="lightbox" class="hidden">
  <div id="lightbox-overlay" onclick="closeLightbox()"></div>
  <div id="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <div id="lb-roast-wrap"></div>
    <div id="lb-usp"></div>
    <div id="lb-sub"></div>
    <div id="lightbox-match"></div>
    <a id="lightbox-btn" class="lightbox-btn" href="" target="_blank" rel="noopener noreferrer">Get This Coffee →</a>
  </div>
</div>

<!-- Share toast -->
<div id="share-toast" role="status" aria-live="polite"></div>

<script>
  const MAX_DIST = Math.sqrt(200 * 200 + 200 * 200)

  const ACCENT = {
    tr: '#c8a96e',
    tl: '#6eb8b8',
    bl: '#b8956e',
    br: '#9a6eb8',
  }

  let coffees = []
  let currentMatches = []
  let lastMatchHandles = ''
  let puckX = 0
  let puckY = 0
  let isDragging = false
  let hasInteracted = false
  let puckHasMoved = false
  let rafId = null
  let prepFilter = 'all'
  let immediateQuadrant = false

  const appEl        = document.getElementById('app')
  const compassEl    = document.getElementById('compass')
  const puckEl       = document.getElementById('puck')
  const hintEl       = document.getElementById('hint')
  const postcardsEl  = document.getElementById('postcards')
  const loadingEl    = document.getElementById('loading')
  const decafToggle  = document.getElementById('decaf-toggle')
  const lightboxEl   = document.getElementById('lightbox')
  const lbMatchEl    = document.getElementById('lightbox-match')
  const lbImgEl      = document.getElementById('lightbox-img')
  const lbBtnEl      = document.getElementById('lightbox-btn')
  const lbRoastWrap  = document.getElementById('lb-roast-wrap')
  const lbUspEl      = document.getElementById('lb-usp')
  const lbSubEl      = document.getElementById('lb-sub')
  const shareBtn     = document.getElementById('share-btn')
  const shareToast   = document.getElementById('share-toast')

  const quadrantEls = {
    tl: document.querySelector('.compass-quadrants .q-tl'),
    tr: document.querySelector('.compass-quadrants .q-tr'),
    bl: document.querySelector('.compass-quadrants .q-bl'),
    br: document.querySelector('.compass-quadrants .q-br'),
  }

  function updateQuadrantColors(q, immediate) {
    ;['tl', 'tr', 'bl', 'br'].forEach(key => {
      const el = quadrantEls[key]
      if (immediate) el.style.transition = 'none'
      el.classList.toggle('active', key === q)
    })
    if (immediate) {
      quadrantEls.tl.offsetHeight // force reflow before restoring transitions
      ;['tl', 'tr', 'bl', 'br'].forEach(key => { quadrantEls[key].style.transition = '' })
    }
  }

  // ── Data loading ──────────────────────────────────────────────────────────

  async function loadCoffees() {
    try {
      const res = await fetch('/api/get-coffees')
      if (!res.ok) throw new Error(`API returned ${res.status}`)
      coffees = await res.json()
      loadingEl.classList.add('hidden')

      // Restore localStorage state silently
      const savedPos = localStorage.getItem('torque_puck_position')
      if (savedPos) {
        try {
          const pos = JSON.parse(savedPos)
          puckX = typeof pos.x === 'number' ? pos.x : 0
          puckY = typeof pos.y === 'number' ? pos.y : 0
          hasInteracted = true
          immediateQuadrant = true
          hintEl.style.display = 'none'
          postcardsEl.classList.remove('hidden')
        } catch(e) {}
      }

      const savedDecaf = localStorage.getItem('torque_decaf')
      if (savedDecaf !== null) decafToggle.checked = savedDecaf === 'true'

      const savedPrep = localStorage.getItem('torque_prep')
      if (savedPrep) {
        prepFilter = savedPrep
        document.querySelectorAll('.prep-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.prep === prepFilter)
        })
      }

      // URL params override localStorage — Change 7
      checkUrlParams()

      renderPuck()
      renderMatches()
    } catch (err) {
      loadingEl.innerHTML = `<div class="loading-error">Couldn't load coffees.<br>${err.message}</div>`
    }
  }

  // ── URL parameter handling — Change 7 ─────────────────────────────────────

  function checkUrlParams() {
    const params = new URLSearchParams(window.location.search)
    const xParam = params.get('x')
    const yParam = params.get('y')
    if (xParam === null || yParam === null) return
    const x = parseInt(xParam, 10)
    const y = parseInt(yParam, 10)
    if (isNaN(x) || isNaN(y)) return
    puckX = Math.max(-100, Math.min(100, x))
    puckY = Math.max(-100, Math.min(100, y))
    hasInteracted = true
    puckHasMoved = true
    immediateQuadrant = true
    hintEl.style.display = 'none'
    postcardsEl.classList.remove('hidden')
    document.body.classList.add('puck-moved')
  }

  // ── Compass rendering ─────────────────────────────────────────────────────

  function getQuadrant(x, y) {
    if (x >= 0 && y >= 0) return 'tr'
    if (x < 0  && y >= 0) return 'tl'
    if (x < 0  && y < 0)  return 'bl'
    return 'br'
  }

  function renderPuck() {
    puckEl.style.left = `${(puckX + 100) / 2}%`
    puckEl.style.top  = `${(100 - puckY) / 2}%`

    if (!hasInteracted) return

    const q = getQuadrant(puckX, puckY)
    updateQuadrantColors(q, immediateQuadrant)
    immediateQuadrant = false

    document.querySelectorAll('.fp').forEach(el => el.classList.remove('active'))
    document.querySelector(`.fp.${q}`).classList.add('active')
  }

  // ── Matching engine ───────────────────────────────────────────────────────

  function matchesPrep(c) {
    if (prepFilter === 'all') return true
    if (!c.preparations) return true
    const preps = c.preparations.toLowerCase()
    if (prepFilter === 'espresso') return preps.includes('espresso') || preps.includes('omni')
    if (prepFilter === 'filter') return preps.includes('filter') || preps.includes('omni')
    return true
  }

  function findMatches() {
    const decafOnly = decafToggle.checked
    const pool = coffees.filter(c => {
      const isDecaf = c.name.toLowerCase().includes('decaf')
      return (decafOnly ? isDecaf : !isDecaf) && matchesPrep(c)
    })

    return pool
      .map(c => {
        const dist = Math.sqrt((puckX - c.quadrant_x) ** 2 + (puckY - c.quadrant_y) ** 2)
        const match = Math.round(100 - (dist / MAX_DIST * 100))
        return { ...c, dist, match }
      })
      .sort((a, b) => {
        if (a.dist !== b.dist) return a.dist - b.dist
        return new Date(b.created_at) - new Date(a.created_at)
      })
      .slice(0, 2)
  }

  function renderMatches() {
    if (!hasInteracted) return

    currentMatches = findMatches()
    const q = getQuadrant(puckX, puckY)
    const accent = ACCENT[q]

    if (!currentMatches.length) {
      lastMatchHandles = ''
      postcardsEl.innerHTML = `<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:24px 0;"><p style="font-size:13px;color:var(--text-muted);text-align:center;font-style:italic;">No coffees match these filters right now.<br>Try adjusting your filters.</p></div>`
      return
    }

    const handles = currentMatches.map(c => c.handle).join(',')

    // Same coffees: only update match % in place to avoid re-triggering card animation
    if (handles === lastMatchHandles) {
      currentMatches.forEach((c, idx) => {
        const el = postcardsEl.querySelectorAll('.postcard-match')[idx]
        if (el) el.textContent = `${c.match}% match`
      })
      return
    }

    lastMatchHandles = handles

    postcardsEl.innerHTML = currentMatches.map((c, idx) => {
      const notes = c.tasting_notes
        ? c.tasting_notes.split(',').map(n => n.trim()).join(' · ')
        : ''
      const imgSrc = c.postcard_image || c.image_url
      const imgInner = imgSrc
        ? `<img class="postcard-img" src="${imgSrc}" alt="" loading="lazy">`
        : `<div class="postcard-img-placeholder"></div>`
      // Match % overlays the image as a warm readout — CSS handles color/glow
      const img = `<div class="postcard-img-wrap">${imgInner}<div class="postcard-match">${c.match}% match</div></div>`

      return `
        <div class="postcard" onclick="openLightbox(${idx})">
          ${img}
          <div class="postcard-body">
            <div class="postcard-name">${c.name}</div>
            ${notes ? `<div class="postcard-notes">${notes}</div>` : ''}
            <a class="postcard-btn" href="${c.product_url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Get This Coffee →</a>
          </div>
        </div>
      `
    }).join('')
  }

  function scheduleRender() {
    if (rafId) cancelAnimationFrame(rafId)
    rafId = requestAnimationFrame(() => {
      renderPuck()
      renderMatches()
      savePuckPosition()
      rafId = null
    })
  }

  // ── localStorage ──────────────────────────────────────────────────────────

  function savePuckPosition() {
    localStorage.setItem('torque_puck_position', JSON.stringify({ x: puckX, y: puckY }))
  }

  function onDecafChange() {
    localStorage.setItem('torque_decaf', decafToggle.checked)
    lastMatchHandles = ''
    renderMatches()
  }

  function setPrepFilter(val) {
    prepFilter = val
    localStorage.setItem('torque_prep', val)
    document.querySelectorAll('.prep-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.prep === val)
    })
    lastMatchHandles = ''
    renderMatches()
  }

  // ── Roast gauge helpers — Change 5 ───────────────────────────────────────

  function getRoastPosition(raw) {
    if (!raw) return null
    const map = { 'very light': 10, 'light': 30, 'medium': 50, 'medium plus': 70, 'dark': 90 }
    return map[raw.trim().toLowerCase()] ?? null
  }

  function formatRoastLabel(raw) {
    if (!raw) return ''
    return raw.trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
  }

  // ── Lightbox — Changes 5 & 6 ─────────────────────────────────────────────

  function parseSubType(raw) {
    if (!raw) return null
    if (Array.isArray(raw)) return raw[0] || null
    if (typeof raw === 'string' && raw.trim().startsWith('[')) {
      try { return JSON.parse(raw)[0] || null } catch(e) {}
    }
    return raw
  }

  function openLightbox(idx) {
    const c = currentMatches[idx]
    if (!c) return
    const imgSrc = c.postcard_image || c.image_url || ''

    lbImgEl.src = imgSrc
    lbMatchEl.textContent = `${c.match}% match`
    lbBtnEl.href = c.product_url

    // Roast gauge
    const roastPos = getRoastPosition(c.roast_color)
    if (roastPos !== null) {
      lbRoastWrap.innerHTML = `
        <div class="lb-roast-label">Roast</div>
        <div class="lb-roast-bar">
          <div class="lb-roast-indicator" style="left:${roastPos}%"></div>
        </div>
        <div class="lb-roast-value">${formatRoastLabel(c.roast_color)}</div>
      `
      lbRoastWrap.style.display = 'flex'
    } else {
      lbRoastWrap.style.display = 'none'
    }

    // USP
    if (c.usp) {
      lbUspEl.textContent = c.usp
      lbUspEl.style.display = ''
    } else {
      lbUspEl.style.display = 'none'
    }

    // Subscription type — parse from possible JSON array
    const subType = parseSubType(c.sub_type)
    if (subType) {
      lbSubEl.textContent = `Ships in the ${subType} subscription`
      lbSubEl.style.display = ''
    } else {
      lbSubEl.style.display = 'none'
    }

    lightboxEl.classList.remove('hidden')
  }

  function closeLightbox() {
    lightboxEl.classList.add('hidden')
    lbImgEl.src = ''
  }

  // Close on Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox()
  })

  // Swipe down to close lightbox
  let lbTouchStartY = 0
  lightboxEl.addEventListener('touchstart', e => {
    lbTouchStartY = e.touches[0].clientY
  }, { passive: true })
  lightboxEl.addEventListener('touchend', e => {
    if (e.changedTouches[0].clientY - lbTouchStartY > 60) closeLightbox()
  }, { passive: true })

  // ── Snap to quadrant ──────────────────────────────────────────────────────

  function snapToQuadrant(x, y) {
    puckEl.classList.add('snapping')
    puckEl.classList.remove('dragging')
    puckX = x
    puckY = y
    markPuckMoved()
    activate()
    scheduleRender()
    setTimeout(() => puckEl.classList.remove('snapping'), 350)
  }

  function activate() {
    if (hasInteracted) return
    hasInteracted = true
    hintEl.style.display = 'none'
    postcardsEl.classList.remove('hidden')
  }

  function markPuckMoved() {
    if (puckHasMoved) return
    puckHasMoved = true
    document.body.classList.add('puck-moved')
  }

  // ── Drag handling ─────────────────────────────────────────────────────────

  function getEventCoords(e) {
    const t = e.touches ? e.touches[0] : e
    return { clientX: t.clientX, clientY: t.clientY }
  }

  function updatePuckFromEvent(e) {
    const rect = compassEl.getBoundingClientRect()
    const { clientX, clientY } = getEventCoords(e)
    const relX = Math.max(0, Math.min(rect.width,  clientX - rect.left))
    const relY = Math.max(0, Math.min(rect.height, clientY - rect.top))
    puckX = Math.round((relX / rect.width)  * 200 - 100)
    puckY = Math.round(100 - (relY / rect.height) * 200)
  }

  compassEl.addEventListener('mousedown', e => {
    isDragging = true
    puckEl.classList.add('dragging')
    puckEl.classList.remove('snapping')
    updatePuckFromEvent(e)
    markPuckMoved()
    activate()
    scheduleRender()
  })

  compassEl.addEventListener('touchstart', e => {
    e.preventDefault()
    isDragging = true
    puckEl.classList.add('dragging')
    puckEl.classList.remove('snapping')
    updatePuckFromEvent(e)
    markPuckMoved()
    activate()
    scheduleRender()
  }, { passive: false })

  document.addEventListener('mousemove', e => {
    if (!isDragging) return
    updatePuckFromEvent(e)
    scheduleRender()
  })

  document.addEventListener('touchmove', e => {
    if (!isDragging) return
    e.preventDefault()
    updatePuckFromEvent(e)
    scheduleRender()
  }, { passive: false })

  function endDrag() {
    if (!isDragging) return
    isDragging = false
    puckEl.classList.remove('dragging')
  }

  document.addEventListener('mouseup', endDrag)
  document.addEventListener('touchend', endDrag)
  document.addEventListener('touchcancel', endDrag)

  // ── Share vibe — Change 7 ─────────────────────────────────────────────────

  function buildShareUrl() {
    const base = window.location.origin + window.location.pathname
    return `${base}?x=${Math.round(puckX)}&y=${Math.round(puckY)}`
  }

  function showToast(msg) {
    shareToast.textContent = msg
    shareToast.classList.remove('hide')
    shareToast.classList.add('show')
    clearTimeout(shareToast._timer)
    shareToast._timer = setTimeout(() => {
      shareToast.classList.remove('show')
      shareToast.classList.add('hide')
    }, 1500)
  }

  shareBtn.addEventListener('click', async () => {
    if (!puckHasMoved) return

    shareBtn.classList.remove('pulsing')
    // Force reflow so animation replays if clicked rapidly
    void shareBtn.offsetWidth
    shareBtn.classList.add('pulsing')
    shareBtn.addEventListener('animationend', () => shareBtn.classList.remove('pulsing'), { once: true })

    const url = buildShareUrl()

    if (navigator.share) {
      try {
        await navigator.share({
          text: "I found my coffee vibe on the Torque compass — try yours",
          url
        })
      } catch(e) {
        if (e.name !== 'AbortError') copyShareUrl(url)
      }
    } else {
      copyShareUrl(url)
    }
  })

  function copyShareUrl(url) {
    navigator.clipboard.writeText(url)
      .then(() => showToast('Link copied'))
      .catch(() => showToast('Link copied'))
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  loadCoffees()
</script>
</body>
</html>
